name: Daily Data Ingestion

on:
  schedule:
    # Run at 05:00 UTC every day (which is 10:30 AM IST)
    - cron: '0 5 * * *'
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:

# Grant write permissions to push the updated data back
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Web Scraper
        run: python -m src.scraper.groww_scraper
        
      - name: Run Chunking Pipeline
        run: python -m src.ingestion.chunker
        
      - name: Run Embedding Pipeline
        run: python -m src.ingestion.embedder
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the modified data and chroma_db directories
          git add data/ chroma_db/
          
          # Commit and push only if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily ingestion update" && git push)
